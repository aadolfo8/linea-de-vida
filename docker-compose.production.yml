services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [app]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [app]

  migrate:
    build:
      context: .
      target: build
    env_file: .env
    command:
      [
        'pnpm',
        '--filter',
        '@linea-de-vida/api',
        'exec',
        'prisma',
        'migrate',
        'deploy',
        '--schema',
        'prisma/schema.prisma',
      ]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    command: ['node', 'apps/api/dist/src/main.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/v1/readiness').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [app]

  worker:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    command: ['node', 'apps/api/dist/src/worker.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const fs = require('node:fs'); const { isWorkerHeartbeatHealthy, WORKER_HEALTH_FILE } = require('/app/apps/api/dist/src/worker-health.js'); let heartbeat; try { heartbeat = fs.readFileSync(WORKER_HEALTH_FILE, 'utf8'); } catch { process.exit(1); } process.exit(isWorkerHeartbeatHealthy(heartbeat, Date.now(), 1) ? 0 : 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [app]

  web:
    build:
      context: .
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: /v1
    restart: unless-stopped
    working_dir: /app/apps/web
    command: ['node', 'node_modules/next/dist/bin/next', 'start', '-H', '0.0.0.0', '-p', '3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [app]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-0}
      ENABLE_HTTPS: ${ENABLE_HTTPS:-false}
    volumes:
      - ./deploy/nginx/start.sh:/usr/local/bin/start-nginx:ro
      - ./deploy/nginx/templates:/etc/nginx/config-templates:ro
      - certbot-webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/start-nginx']
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'nginx -t']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [app]

  certbot:
    image: certbot/certbot:latest
    profiles: ['certbot']
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL is required}
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    command:
      [
        'certonly',
        '--webroot',
        '--webroot-path',
        '/var/www/certbot',
        '--email',
        '${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL is required}',
        '--agree-tos',
        '--no-eff-email',
        '--non-interactive',
        '--keep-until-expiring',
        '--cert-name',
        '${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}',
        '--domain',
        '${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}',
      ]

networks:
  app:

volumes:
  postgres-data:
  redis-data:
  certbot-webroot:
  letsencrypt:
