services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [app]

  migrate:
    build:
      context: .
      target: build
    env_file: .env
    command:
      [
        'pnpm',
        '--filter',
        '@linea-de-vida/api',
        'exec',
        'prisma',
        'migrate',
        'deploy',
        '--schema',
        'prisma/schema.prisma',
      ]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file: .env
    environment:
      THUMBNAIL_DIR: /var/lib/linea/thumbs
    volumes:
      - thumbnail-data:/var/lib/linea/thumbs
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/v1/readiness').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      app:
      proxy:
        aliases: [linea-api]

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: /v1
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      app:
      proxy:
        aliases: [linea-web]

networks:
  app:
  proxy:
    external: true

volumes:
  postgres-data:
  thumbnail-data:
